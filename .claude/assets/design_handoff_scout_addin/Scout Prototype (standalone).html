document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

n      signedIn: false, erp: 'NetSuite',\n      checklist: { erp: false, otto: false, invite: false },\n      tab: 'suppliers',\n      otto: 'idle', ottoBannerDismissed: false, otShipDate: 'Jul 2', otSelFile: 0,\n      ottoOld: 'list',\n      checks: [\n        { vendor: 'Acme Steel', order: 'PO #4471', contact: 'Maria Chen', email: 'maria@acmesteel.com', initials: 'MC', on: true, cadence: 'Every 3 days', next: 'Jul 1', steps: this.defaultSteps() },\n        { vendor: 'Delmar Tooling', order: 'PO #4472', contact: 'Ray Park', email: 'ray@delmartool.com', initials: 'RP', on: true, cadence: 'Weekly', next: 'Jul 3', steps: this.defaultSteps() },\n        { vendor: 'Vance Components', order: 'PO #4468', contact: 'Jess Dunn', email: 'jess@vancecomp.com', initials: 'JD', on: false, cadence: 'Paused', next: '', steps: this.defaultSteps() }\n      ],\n      cuView: 'list', cuVendor: 0, editStepIdx: 0,\n      draftMsg: '', draftSend: 'Day 0', draftCond: 'No reply yet', draftRepeat: \"Don't repeat\", draftStop: '3 tries',\n      auditView: 'feed', auditSeen: false, toast: false, findKey: 'price', composeOpen: false\n    };\n  }\n\n  state = this.initialState();\n\n  componentDidMount() {\n    try {\n      const raw = localStorage.getItem('scoutProto');\n      if (raw) this.setState(JSON.parse(raw));\n    } catch (e) {}\n  }\n  save(patch, cb) {\n    this.setState(patch, () => {\n      try { localStorage.setItem('scoutProto', JSON.stringify(this.state)); } catch (e) {}\n      if (cb) cb();\n    });\n  }\n\n  findingData(key) {\n    const M = {\n      price: { vendor: 'Acme Steel', order: 'PO #4471', contact: 'Maria Chen', email: 'maria@acmesteel.com', init: 'MC', leftLbl: 'QUOTED', left: '$41.00', rightLbl: 'BILLED', right: '$42.50', impact: '+$1.50/unit · +$180 on 120 units', up: true,\n        ev1Who: 'Maria Chen', ev1Date: 'May 3', ev1: '…happy to hold pricing at $41.00 per unit for this PO.',\n        ev2Who: 'Maria Chen', ev2Date: 'Jun 27', ev2: 'Pricing holds at $42.50/un pped' : 'Quantity mismatch'); paneBack = true; paneScout = false; }\n        else if (s.auditView === 'dispute') { paneTitle = 'Dispute draft'; paneBack = true; paneScout = false; }\n      }\n    }\n\n    // ERP selector styling helper\n    const erpBorder = (name) => s.erp === name ? '1.5px solid #141414' : '1px solid #e2e2e2';\n    const erpDot = (name) => s.erp === name ? 'width:16px;height:16px;border-radius:50%;border:5px solid #141414;flex:0 0 16px;display:inline-block' : 'width:16px;height:16px;border-radius:50%;border:1px solid #cfcfcf;flex:0 0 16px;display:inline-block';\n\n    // checklist progress\n    const done = 1 + (s.checklist.erp ? 1 : 0) + (s.checklist.otto ? 1 : 0) + (s.checklist.invite ? 1 : 0);\n\n    // nav helpers\n    const navOn = (t) => s.tab === t;\n    const navStyle = (t) => ({\n      bg: navOn(t) ? 'background:#141414;' : '',\n      stroke: navOn(t) ? '#fff' : '#6a6a6a',\n      sw: navOn(t) ? '1.9' : '1.7',\n      color: navOn(t) ? '#141414' : '#8a8a8a',\n      weight: navOn(t) ? '700' : '600'\n    });\n    const nS = navStyle('suppliers'), nO = navStyle('otto'), nC = navStyle('checkups'), nA = navStyle('audit');\n\n    // checks list view-model\n    const checksVM = s.checks.map((c, i) => ({\n      idx: i, vendor: c.vendor, order: orderOf(c), contactVendor: c.contact + ' · ' + c.vendor, contact: c.contact, email: c.email, initials: c.initials,\n      onLabel: c.on ? 'ON' : 'OFF',\n      onColor: c.on ? 'color:#141414' : 'color:#9a9a9a',\n      trackStyle: c.on ? 'background:#141414' : 'background:#dcdcdc',\n      knobStyle: c.on ? 'right:2px' : 'left:2px',\n      dim: c.on ? '' : 'opacity:.6',\n      titleColor: c.on ? 'color:#141414' : 'color:#666',\n      cadenceLine: c.on ? ('⏱ ' + c.cadence + (c.next ? ' · next ' + c.next : '')) : 'Paused'\n    }));\n\n    const curStepsVM = (cur.steps || []).map((st, i) => ({\n      idx: i, num: i + 1, name: st.name, msg: st.msg, hasMsg: !!st.msg,\n      timing: this.timingLine(st)\n    }));\n\n    const f = this.findingData(s.findKey);\n\n\n    const h = {\n      // onboarding\n      signIn: () => this.save({ signedIn: true, onb: 'checklist' }),\n      openConnect: () => this.save({ onb: 'connect' }),\n      toggleOtto: () => this.save({ checklist: { ...s.checklist, otto: !s.checklist.otto } }),\n      toggleInvite: () => this.save({ checklist: { ...s.checklist, invite: !s.checklist.invite } }),\n      pickErp: (e) => this.save({ erp: e.currentTarget.dataset.erp }),\n      connectContinue: () => this.save({ onb: 'checklist', checklist: { ...s.checklist, erp: true } }),\n      finishOnboarding: () => this.save({ phase: 'app', tab: 'suppliers' }),\n      // otto new\n      ottoReview: () => this.save({ otto: 'review' }),\n      ottoDismiss: () => this.save({ otto: 'idle', ottoBannerDismissed: true }),\n      ottoEdit: () => this.save({ otto: 'edit' }),\n      onShipDate: (e) => this.setState({ otShipDate: e.target.value }),\n      ottoErp: () => this.save({ otto: 'erp' }),\n      pickFile: (e) => this.save({ otSelFile: +e.currentTarget.dataset.file, otto: 'fileConfirm' }),\n      newSheet: () => this.save({ otSelFile: 2, otto: 'recording' }, () => {\n        clearTimeout(this._rec); this._rec = setTimeout(() => this.save({ otto: 'verify' }), 1700);\n      }),\n      confirmFile: () => this.save({ otto: 'recording' }, () => {\n        clearTimeout(this._rec); this._rec = setTimeout(() => this.save({ otto: 'verify' }), 1700);\n      }),\n      ottoRecord: () => {\n        if (s.erp === 'Excel / Sheets') return this.save({ otto: 'files' });\n        this.save({ otto: 'recording' }, () => {\n          clearTimeout(this._rec); this._rec = setTimeout(() => this.save({ otto: 'verify' }), 1700);\n        });\n      },\n      ottoVerifyDone: () => this.save({ otto: 'idle', ottoBannerDismissed: true, tab: 'suppliers' }),\n      // otto old\n      recordOld: () => this.save({ ottoOld: 'reinstruct' }),\n      oldConfirm: () => this.save({ ottoOld: 'erp' }),\n      oldRec rrentTarget: { dataset: { step: st.length - 1 } } });\n        });\n      },\n      openAdd: () => this.save({ cuView: 'add', draftMsg: 'Hi Tom — checking in on the status of our latest order. Any update?', draftSend: 'Day 0', draftCond: 'No reply yet', draftRepeat: \"Don't repeat\", draftStop: '3 tries' }),\n      createCheck: () => {\n        const cadMap = { \"Don't repeat\": 'One-time', '2 days': 'Every 2 days', '3 days': 'Every 3 days', 'Weekly': 'Weekly' };\n        const exists = s.checks.some(c => c.vendor === 'Orbit Packaging');\n        const checks = exists ? s.checks : [...s.checks, {\n          vendor: 'Orbit Packaging', order: 'PO #4459', contact: 'Tom Silva', email: 'tom@orbitpack.com', initials: 'TS',\n          on: true, cadence: cadMap[s.draftRepeat] || 'Every 3 days', next: 'Jul 5',\n          steps: [{ name: 'Initial check', msg: s.draftMsg, send: s.draftSend, cond: s.draftCond, repeat: s.draftRepeat, stop: s.draftStop }]\n        }];\n        this.save({ checks, cuView: 'list' });\n      },\n      activityToOtto: () => this.save({ tab: 'otto', cuView: 'list', ottoOld: 'list' }),\n      // audit\n      openFinding: (e) => this.save({ findKey: e.currentTarget.dataset.key, auditView: 'detail' }),\n      openDispute: () => this.save({ auditView: 'detail' }),\n      openCompose: () => this.save({ composeOpen: true }),\n      closeCompose: () => this.save({ composeOpen: false }),\n      sendCompose: () => this.save({ composeOpen: false, auditView: 'feed' }),\n      rerunAudits: () => { /* visual no-op refresh */ this.forceUpdate(); },\n      dismissToast: () => this.save({ toast: false }),\n      reviewFromToast: () => this.save({ toast: false, tab: 'audit', auditView: 'detail', findKey: 'price', auditSeen: true }),\n      // nav + back\n      goTab: (e) => {\n        const t = e.currentTarget.dataset.tab;\n        const patch = { tab: t, toast: false, composeOpen: false };\n        if (t === 'audit') { patch.auditSeen = true; patch.auditView = 'feed'
